[window]
opacity = 0.85
startup_mode = "Windowed"
decorations = "full"

[window.dimensions]
columns = 120
lines = 30

[window.position]
x = 100
y = 100

[window.padding]
x = 10
y = 10

[font]
size = 14.0

[font.normal]
family = "Fira Code"
style = "Regular"

[font.bold]
family = "Fira Code"
style = "Bold"

[font.italic]
family = "Fira Code"
style = "Italic"

[colors.primary]
background = "0x1E1E2E"
foreground = "0xCDD6F4"

[colors.normal]
black = "0x45475a"
red = "0xf38ba8"
green = "0xa6e3a1"
yellow = "0xf9e2af"
blue = "0x89b4fa"
magenta = "0xf5c2e7"
cyan = "0x94e2d5"
white = "0xbac2de"

[colors.bright]
black = "0x585b70"
red = "0xf38ba8"
green = "0xa6e3a1"
yellow = "0xf9e2af"
blue = "0x89b4fa"
magenta = "0xf5c2e7"
cyan = "0x94e2d5"
white = "0xa6adc8"

[performance]
render_timer = true
vsync = true

[[key_bindings]]
key = "N"
mods = "Control"
action = "CreateNewWindow"

[usage]
startup_time = true

[export]
logs = "true"

theme = "Default"
key_bindings = []
