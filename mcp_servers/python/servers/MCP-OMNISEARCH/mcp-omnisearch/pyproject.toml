[project]
name = "mcp-omnisearch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.10.1",
    "requests>=2.32.4",
]

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project.scripts]
mcp-omnisearch = "mcp_omnisearch.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_omnisearch"]
