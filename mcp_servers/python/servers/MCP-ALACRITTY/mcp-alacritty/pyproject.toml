[project]
name = "mcp-alacritty"
version = "0.1.0"
description = "MCP server for Alacritty terminal emulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10.1",
    "psutil>=7.0.0",
    "pyyaml>=6.0.2",
    "toml>=0.10.2",
]

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project.scripts]
mcp-alacritty = "mcp_alacritty.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_alacritty"]
