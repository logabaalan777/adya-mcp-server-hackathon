[project]
name = "mcp-openstreetmap"
version = "0.1.0"
description = "open street map for geolocations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.12.13",
    "fastmcp>=2.9.1",
    "geojson>=3.2.0",
    "haversine>=2.9.0",
    "langchain-mcp-adapters>=0.1.8",
    "mcp[cli]>=1.10.1",
    "shapely>=2.1.1",
    "uvicorn>=0.35.0",
]

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project.scripts]
mcp-openstreetmap = "mcp_openstreetmap.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_openstreetmap"]
